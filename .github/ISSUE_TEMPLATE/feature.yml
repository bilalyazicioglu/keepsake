name: Feature proposal
description: Describe a use case and a focused improvement.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the current workflow and where it falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: done
    attributes:
      label: What would a successful first version look like?
